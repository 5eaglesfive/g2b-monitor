name: g2b-orderplan
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1-5"        # 평일 09:00 KST
permissions:
  contents: write                # 발송 이력 커밋용
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python g2b_orderplan_crawler.py --fast --debug --send-mail --seen-file state/seen_plans.json
      - name: 발송 이력 저장
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add state/seen_plans.json || true
          git diff --staged --quiet || (git commit -m "update seen plans" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g2b-result
          path: output/
