name: g2b-orderplan

on:
  workflow_dispatch:          # Actions 탭에서 수동 실행
  schedule:
    - cron: "0 0 * * 1-5"     # 평일 09:00 KST (cron은 UTC 기준)

jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python g2b_orderplan_crawler.py --debug
      - uses: actions/upload-artifact@v4
        if: always()           # 실패해도 스크린샷/HTML 보존
        with:
          name: g2b-result
          path: output/
